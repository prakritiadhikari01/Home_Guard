<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>HomeGuard – Members</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
<div class="app-layout">
  <div class="sidebar" id="sidebar"></div>
  <div class="main-content">
    <div id="topbar"></div>
    <div class="page-body">

      <!-- Search + Add -->
      <div style="display:flex;gap:12px;align-items:center;margin-bottom:24px;">
        <div style="flex:1;max-width:520px;position:relative;">
          <svg style="position:absolute;left:14px;top:50%;transform:translateY(-50%);" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#4a6080" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" placeholder="Search members..." id="searchInput" oninput="filterMembers()"
            style="width:100%;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.09);color:white;padding:10px 14px 10px 40px;border-radius:10px;font-size:14px;outline:none;"/>
        </div>
        <button onclick="showAddModal()" style="background:#3b82f6;color:white;padding:10px 20px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;border:none;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Add member
        </button>
      </div>

      <div style="font-size:11px;letter-spacing:.1em;color:#3a4a6a;margin-bottom:14px;" id="rosterLabel">// ROSTER · 4</div>

      <!-- Members Grid -->
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px;" id="membersGrid"></div>

    </div>
  </div>
</div>

<!-- Add Member Modal -->
<div id="addModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:100;align-items:center;justify-content:center;">
  <div style="background:#0d1929;border:1px solid rgba(255,255,255,0.1);border-radius:16px;padding:28px;width:420px;position:relative;">
    <button onclick="hideAddModal()" style="position:absolute;top:18px;right:18px;background:none;border:none;color:#6a8aaa;cursor:pointer;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    <div style="color:white;font-size:18px;font-weight:700;margin-bottom:4px;">Add household member</div>
    <div style="color:#4a6080;font-size:13px;margin-bottom:20px;">They'll receive an email to log in (or register) and verify their identity.</div>
    <div style="display:flex;flex-direction:column;gap:14px;">
      <div><label style="color:#8a9ab8;font-size:12px;display:block;margin-bottom:5px;">Full name</label>
        <input id="inviteName" type="text" placeholder="Name" style="width:100%;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);color:white;padding:10px 14px;border-radius:8px;font-size:14px;outline:none;"/></div>
      <div><label style="color:#8a9ab8;font-size:12px;display:block;margin-bottom:5px;">Email</label>
        <input id="inviteEmail" type="email" placeholder="name@email.com" style="width:100%;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);color:white;padding:10px 14px;border-radius:8px;font-size:14px;outline:none;"/></div>
      <div><label style="color:#8a9ab8;font-size:12px;display:block;margin-bottom:5px;">Phone (optional)</label>
        <input id="invitePhone" type="tel" placeholder="+977 98XXXXXXXX" style="width:100%;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);color:white;padding:10px 14px;border-radius:8px;font-size:14px;outline:none;"/></div>
      <div><label style="color:#8a9ab8;font-size:12px;display:block;margin-bottom:5px;">Role</label>
        <select id="inviteRole" style="width:100%;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);color:white;padding:10px 14px;border-radius:8px;font-size:14px;outline:none;">
          <option value="Viewer">Viewer — can watch & receive alerts</option>
          <option value="Member">Member — can manage devices & view all</option>
          <option value="Owner">Owner — full control & billing</option>
        </select></div>
    </div>
    <div style="display:flex;gap:10px;margin-top:22px;">
      <button onclick="hideAddModal()" style="flex:1;background:rgba(255,255,255,0.06);color:#8a9ab8;padding:11px;border-radius:8px;font-size:14px;cursor:pointer;border:none;">Cancel</button>
      <button onclick="sendInvite()" style="flex:1;background:#3b82f6;color:white;padding:11px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;border:none;">Send invite</button>
    </div>
  </div>
</div>

<style>
.member-card { border-radius:14px;padding:20px;display:flex;align-items:center;gap:16px;cursor:pointer;transition:background .15s; }
.member-card:hover { background:rgba(255,255,255,0.06); }
.role-badge { font-size:10px;font-weight:700;letter-spacing:.08em;padding:2px 8px;border-radius:4px; }
.role-owner { background:rgba(59,130,246,0.15);color:#60a5fa; }
.role-member { background:rgba(34,197,94,0.1);color:#22c55e; }
.role-viewer { background:rgba(234,179,8,0.1);color:#eab308; }
.last-seen { font-size:10px;letter-spacing:.08em;color:#3a4a6a;margin-top:6px; }
.last-seen span { color:#4a6080; }
</style>

<script src="{% static 'js/sidebar.js' %}"></script>
<script>
  document.getElementById('sidebar').innerHTML = renderSidebar('members');
  initHomeSwitcher();
  const activeHome = localStorage.getItem('hg_active_home') || 'My Home';
  document.getElementById('topbar').innerHTML = renderTopbar('Members', `${activeHome} · manage household access`);

  let members = JSON.parse(localStorage.getItem('hg_members') || JSON.stringify([
    { initials:'AR', name:'Alex Reyes', role:'Owner', rel:'Primary admin', email:'alex@home.com', status:'ACTIVE', lastSeen:'NOW', where:'FRONT DOOR', color:'#3b82f6' },
    { initials:'ER', name:'Elena Reyes', role:'Member', rel:'Spouse', email:'elena@home.com', status:'ACTIVE', lastSeen:'15:42', where:'FRONT DOOR', color:'#10b981' },
    { initials:'MK', name:'Marcus K.', role:'Member', rel:'Son', email:'marcus@home.com', status:'ACTIVE', lastSeen:'YESTERDAY', where:'GARAGE', color:'#8b5cf6' },
    { initials:'SB', name:'Sara Bell', role:'Viewer', rel:'Housekeeper', email:'sara@home.com', status:'ACTIVE', lastSeen:'MON', where:'FRONT DOOR', color:'#ef4444' },
  ]));

  function saveMembers() { localStorage.setItem('hg_members', JSON.stringify(members)); }

  function getInitials(name) {
    return name.split(' ').filter(Boolean).slice(0,2).map(w => w[0].toUpperCase()).join('');
  }
  function getColor(seed) {
    const colors = ['#3b82f6','#10b981','#8b5cf6','#ef4444','#eab308','#06b6d4'];
    let h = 0; for (let i=0;i<seed.length;i++) h += seed.charCodeAt(i);
    return colors[h % colors.length];
  }

  function renderMembers(list) {
    document.getElementById('rosterLabel').textContent = `// ROSTER · ${members.length}`;
    document.getElementById('membersGrid').innerHTML = list.map(m => `
      <div class="card member-card">
        <div style="width:54px;height:54px;border-radius:50%;background:${m.color};display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:white;flex-shrink:0;">${m.initials}</div>
        <div>
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;">
            <span style="color:white;font-size:15px;font-weight:600;">${m.name}</span>
            <span class="role-badge role-${m.role.toLowerCase()}">${m.role.toUpperCase()}</span>
          </div>
          <div style="color:#6a8aaa;font-size:13px;">${m.email || m.rel}</div>
          ${m.status === 'ACTIVE'
            ? `<div class="last-seen">LAST SEEN · <span>${m.lastSeen}</span> · <span>${m.where}</span></div>`
            : `<div style="display:flex;align-items:center;gap:5px;margin-top:6px;"><span style="width:6px;height:6px;border-radius:50%;background:#eab308;"></span><span style="color:#eab308;font-size:10px;letter-spacing:.08em;">INVITATION PENDING</span></div>`
          }
        </div>
      </div>
    `).join('');
  }

  function filterMembers() {
    const q = document.getElementById('searchInput').value.toLowerCase();
    renderMembers(members.filter(m => m.name.toLowerCase().includes(q) || (m.email||'').toLowerCase().includes(q)));
  }

  function showAddModal() { document.getElementById('addModal').style.display = 'flex'; }
  function hideAddModal() { document.getElementById('addModal').style.display = 'none'; }

  function sendInvite() {
    const name = document.getElementById('inviteName').value.trim();
    const email = document.getElementById('inviteEmail').value.trim();
    const phone = document.getElementById('invitePhone').value.trim();
    const role = document.getElementById('inviteRole').value;
    if (!name || !email) { alert('Please enter at least a name and email.'); return; }
    members.push({
      initials: getInitials(name), name, role, rel: phone || '', email,
      status: 'PENDING', lastSeen: '', where: '', color: getColor(name)
    });
    saveMembers();
    renderMembers(members);
    document.getElementById('inviteName').value = '';
    document.getElementById('inviteEmail').value = '';
    document.getElementById('invitePhone').value = '';
    hideAddModal();
  }

  renderMembers(members);
</script>
</body>
</html>
