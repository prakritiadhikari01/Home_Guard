<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>HomeGuard – Alerts</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
<div class="app-layout">
  <div class="sidebar" id="sidebar"></div>
  <div class="main-content">
    <div id="topbar"></div>
    <div class="page-body">

      <!-- Stats Row -->
      <div style="display:grid;grid-template-columns:repeat(3,180px);gap:14px;margin-bottom:24px;">
        <div class="card p-5">
          <div style="font-size:11px;letter-spacing:.1em;color:#3a4a6a;margin-bottom:8px;">ACTIVE</div>
          <div style="font-size:36px;font-weight:700;color:#ef4444;">2</div>
        </div>
        <div class="card p-5">
          <div style="font-size:11px;letter-spacing:.1em;color:#3a4a6a;margin-bottom:8px;">TODAY</div>
          <div style="font-size:36px;font-weight:700;color:#eab308;">3</div>
        </div>
        <div class="card p-5">
          <div style="font-size:11px;letter-spacing:.1em;color:#3a4a6a;margin-bottom:8px;">RESOLVED</div>
          <div style="font-size:36px;font-weight:700;color:#22c55e;">14</div>
        </div>
      </div>

      <!-- Alert Cards -->
      <div style="display:flex;flex-direction:column;gap:14px;max-width:760px;" id="alertList"></div>

    </div>
  </div>
</div>

<style>
.alert-card { border-radius:12px;padding:20px 20px 20px 24px;display:flex;align-items:flex-start;gap:16px; }
.alert-action-btn {
  padding:7px 16px;border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;
  display:inline-flex;align-items:center;gap:5px;border:1px solid;transition:all .15s;
}
.btn-view { background:rgba(59,130,246,0.15);color:#60a5fa;border-color:rgba(59,130,246,0.3); }
.btn-view:hover { background:rgba(59,130,246,0.25); }
.btn-resolve { background:rgba(34,197,94,0.1);color:#22c55e;border-color:rgba(34,197,94,0.3); }
.btn-resolve:hover { background:rgba(34,197,94,0.2); }
.btn-dismiss { background:rgba(255,255,255,0.04);color:#6a8aaa;border-color:rgba(255,255,255,0.1); }
.btn-dismiss:hover { background:rgba(255,255,255,0.08); }
</style>

<script src="{% static 'js/sidebar.js' %}"></script>
<script>
  document.getElementById('sidebar').innerHTML = renderSidebar('alerts');
  initHomeSwitcher();
  document.getElementById('topbar').innerHTML = renderTopbar('Alerts Center', 'Active and historical security events');

  const alerts = [
    {
      level:'critical', cam:'CAM-03', time:'03:42',
      title:'Repeated unknown presence',
      sub:'Backyard · 3 detection cycles within 12 minutes',
      icon:`<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>`,
      border:'rgba(239,68,68,0.25)', bg:'rgba(239,68,68,0.05)'
    },
    {
      level:'warning', cam:'CAM-02', time:'14:22',
      title:'Unrecognized vehicle in driveway',
      sub:'Plate captured · classified as likely delivery',
      icon:`<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#eab308" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>`,
      border:'rgba(234,179,8,0.2)', bg:'rgba(234,179,8,0.04)'
    },
    {
      level:'warning', cam:'CAM-03', time:'12:55',
      title:'Motion at side path',
      sub:'Animal motion detected · 64% confidence',
      icon:`<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#eab308" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>`,
      border:'rgba(234,179,8,0.2)', bg:'rgba(234,179,8,0.04)'
    },
  ];

  function dismissAlert(btn) {
    btn.closest('.alert-card').parentElement.remove();
  }

  document.getElementById('alertList').innerHTML = alerts.map((a,i) => `
    <div style="border:1px solid ${a.border};border-left:3px solid ${a.level==='critical'?'#ef4444':'#eab308'};border-radius:12px;background:${a.bg};">
      <div class="alert-card">
        <div style="flex-shrink:0;margin-top:2px;">${a.icon}</div>
        <div style="flex:1;">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">
            <span class="badge ${a.level==='critical'?'badge-critical':'badge-warning'}">${a.level.toUpperCase()}</span>
            <span style="font-size:12px;color:#4a5a7a;">${a.cam} · ${a.time}</span>
          </div>
          <div style="color:white;font-size:16px;font-weight:600;margin-bottom:4px;">${a.title}</div>
          <div style="color:#6a8aaa;font-size:13px;margin-bottom:14px;">${a.sub}</div>
          <div style="display:flex;gap:8px;">
            <button class="alert-action-btn btn-view" onclick="window.location.href='live.html'">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="14" rx="2"/></svg>
              View feed
            </button>
            <button class="alert-action-btn btn-resolve">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
              Resolve
            </button>
            <button class="alert-action-btn btn-dismiss" onclick="dismissAlert(this)">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
              Dismiss
            </button>
          </div>
        </div>
      </div>
    </div>
  `).join('');
</script>
</body>
</html>
