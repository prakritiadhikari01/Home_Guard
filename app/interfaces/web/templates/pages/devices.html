<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>HomeGuard – Devices</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
<div class="app-layout">
  <div class="sidebar" id="sidebar"></div>
  <div class="main-content">
    <div id="topbar"></div>
    <div class="page-body">

      <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:20px;">
        <div style="display:flex;gap:12px;" id="statRow"></div>
        <button class="btn-primary" id="openAddDevice">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Add Device
        </button>
      </div>

      <div class="device-grid" id="deviceGrid"></div>

    </div>
  </div>
</div>

<!-- Add Device Modal -->
<div class="modal-overlay" id="addDeviceModal">
  <div class="modal-card">
    <div class="modal-header">
      <div style="color:white;font-size:16px;font-weight:600;">Add device</div>
      <button class="modal-close" id="closeAddDevice">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <label class="field-label">Device name</label>
      <input class="field-input" id="fName" type="text" placeholder="e.g. Front Door Camera">
      <label class="field-label">Device type</label>
      <select class="field-input" id="fType">
        <option value="camera">Camera</option>
        <option value="smart_lock">Smart Lock</option>
      </select>
      <label class="field-label">Location</label>
      <input class="field-input" id="fLocation" type="text" placeholder="e.g. Front Entrance">
      <label class="field-label">IP address</label>
      <input class="field-input" id="fIp" type="text" placeholder="192.168.1.15">
      <label class="field-label">Stream URL <span style="color:#4a6080;">(optional)</span></label>
      <input class="field-input" id="fStream" type="text" placeholder="http://phone-ip:8080/video">
      <div id="formError" style="color:#f87171;font-size:12px;margin-top:6px;display:none;"></div>
    </div>
    <div class="modal-footer">
      <button class="btn-ghost" id="cancelAddDevice">Cancel</button>
      <button class="btn-primary" id="submitAddDevice">Register device</button>
    </div>
  </div>
</div>

<style>
.btn-primary { background:#3b82f6;color:white;padding:10px 20px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;border:none; }
.btn-primary:hover { background:#2f6fd9; }
.btn-primary:disabled { opacity:.6;cursor:default; }
.btn-ghost { background:rgba(255,255,255,0.06);color:#9ab0cc;padding:10px 18px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;border:none; }
.btn-ghost:hover { background:rgba(255,255,255,0.1);color:white; }
.stat-pill { background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:12px;padding:10px 18px;min-width:120px; }
.stat-pill .label { font-size:11px;color:#4a6080;letter-spacing:.04em;margin-bottom:4px; }
.stat-pill .value { font-size:20px;font-weight:700;color:white; }
.device-grid { display:grid;grid-template-columns:repeat(3, 1fr);gap:16px; }
@media (max-width: 1100px){ .device-grid{ grid-template-columns:repeat(2,1fr); } }
@media (max-width: 680px){ .device-grid{ grid-template-columns:1fr; } }
.device-card { background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:14px;padding:18px;cursor:pointer;transition:transform .15s, border-color .15s; }
.device-card:hover { transform:translateY(-2px);border-color:rgba(59,130,246,0.4); }
.device-icon { width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:rgba(59,130,246,0.12);color:#3b82f6;margin-bottom:14px; }
.device-icon.lock { background:rgba(168,85,247,0.12);color:#a855f7; }
.device-name { color:white;font-size:15px;font-weight:600;margin-bottom:2px; }
.device-type { color:#4a6080;font-size:11px;letter-spacing:.04em;text-transform:uppercase;margin-bottom:12px; }
.device-status-row { display:flex;align-items:center;gap:6px;font-size:12px;color:#9ab0cc;margin-bottom:4px; }
.status-dot { width:7px;height:7px;border-radius:50%;background:#22c55e;display:inline-block; }
.status-dot.offline { background:#64748b; }
.status-dot.locked { background:#a855f7; }
.device-meta { color:#4a6080;font-size:11px;margin-bottom:14px; }
.device-footer { display:flex;justify-content:space-between;align-items:center; }
.device-open { color:#3b82f6;font-size:12px;font-weight:600; }
.grid-message { grid-column: 1 / -1; color:#4a6080; font-size:13px; text-align:center; padding:40px 20px;border:1px dashed rgba(255,255,255,0.08); border-radius:14px; }
.grid-message.is-error { color:#f87171; border-color:rgba(248,113,113,0.2); }
.modal-overlay { display:none;position:fixed;inset:0;background:rgba(2,8,20,0.7);backdrop-filter:blur(2px);align-items:center;justify-content:center;z-index:50; }
.modal-overlay.open { display:flex; }
.modal-card { background:#0a1424;border:1px solid rgba(255,255,255,0.08);border-radius:16px;width:420px;max-width:92vw;max-height:88vh;overflow-y:auto; }
.modal-header { display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid rgba(255,255,255,0.06); }
.modal-close { background:none;border:none;color:#6a8aaa;cursor:pointer;padding:4px; }
.modal-close:hover { color:white; }
.modal-body { padding:18px 20px;display:flex;flex-direction:column; }
.field-label { color:#9ab0cc;font-size:12px;font-weight:600;margin:12px 0 6px; }
.field-label:first-child { margin-top:0; }
.field-input { background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:8px;padding:9px 12px;color:white;font-size:13px;outline:none;width:100%;font-family:inherit; }
.field-input:focus { border-color:#3b82f6; }
.field-input::placeholder { color:#3d5170; }
.modal-footer { display:flex;justify-content:flex-end;gap:10px;padding:16px 20px;border-top:1px solid rgba(255,255,255,0.06); }
</style>

<script src="{% static 'js/sidebar.js' %}"></script>
<script>
  const API_BASE = "/api";
  const TOKEN = localStorage.getItem("access");
  const HOME_ID = localStorage.getItem("active_home");

  if (!TOKEN) {
    window.location.href = "{% url 'web:login' %}";
  }

  function authHeaders(extra = {}) {
    return { Authorization: `Bearer ${TOKEN}`, ...extra };
  }

  function handleAuthFailure(res) {
    if (res.status === 401) {
      localStorage.clear();
      window.location.href = "{% url 'web:login' %}";
      return true;
    }
    return false;
  }

  document.getElementById('sidebar').innerHTML = renderSidebar('devices');
  initHomeSwitcher();
  document.getElementById('topbar').innerHTML = renderTopbar('Devices', 'Register devices, monitor health & manage connectivity');

  function timeAgo(isoString) {
    if (!isoString) return 'Never';
    const diffMs = Date.now() - new Date(isoString).getTime();
    const sec = Math.floor(diffMs / 1000);
    if (sec < 10) return 'Just now';
    if (sec < 60) return `${sec} sec ago`;
    const min = Math.floor(sec / 60);
    if (min < 60) return `${min} min${min > 1 ? 's' : ''} ago`;
    const hr = Math.floor(min / 60);
    return `${hr} hour${hr > 1 ? 's' : ''} ago`;
  }

  let devices = [];

  async function loadDevices() {
    const grid = document.getElementById('deviceGrid');
    try {
      const res = await fetch(`${API_BASE}/homes/${HOME_ID}/devices/`, {
        headers: authHeaders({ 'Accept': 'application/json' }),
      });
      if (handleAuthFailure(res)) return;
      if (!res.ok) throw new Error('Failed to load devices');
      const data = await res.json();

      devices = data.map(d => ({
        id: d.id,
        name: d.name,
        type: d.device_type,
        location: d.location,
        status: d.status,
        lastActive: timeAgo(d.last_active),
        lockState: undefined,
        battery: undefined,
      }));

      renderStats();
      renderGrid();
    } catch (err) {
      console.error(err);
      document.getElementById('statRow').innerHTML = '';
      grid.innerHTML = `<div class="grid-message is-error">Could not load devices. Please check your connection and refresh.</div>`;
    }
  }

  const icons = {
    camera: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>`,
    smart_lock: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>`,
  };

  function renderStats(){
    const total = devices.length;
    const online = devices.filter(d => d.status === 'online').length;
    const offline = total - online;
    document.getElementById('statRow').innerHTML = `
      <div class="stat-pill"><div class="label">REGISTERED</div><div class="value">${total}</div></div>
      <div class="stat-pill"><div class="label">ONLINE</div><div class="value" style="color:#22c55e;">${online}</div></div>
      <div class="stat-pill"><div class="label">OFFLINE</div><div class="value" style="color:#64748b;">${offline}</div></div>
    `;
  }

  function deviceCard(d){
    const isLock = d.type === 'smart_lock';
    const statusLine = isLock
      ? `<div class="device-status-row"><span class="status-dot locked"></span>${d.lockState || 'Locked'}</div>
         <div class="device-meta">${d.battery != null ? `Battery ${d.battery}%` : `Last active ${d.lastActive}`}</div>`
      : `<div class="device-status-row"><span class="status-dot ${d.status === 'online' ? '' : 'offline'}"></span>${d.status === 'online' ? 'Online' : 'Offline'}</div>
         <div class="device-meta">Last active ${d.lastActive}</div>`;

    return `
      <div class="device-card" data-id="${d.id}">
        <div class="device-icon ${isLock ? 'lock' : ''}">${icons[d.type] || icons.camera}</div>
        <div class="device-name">${d.name}</div>
        <div class="device-type">${isLock ? 'Smart Lock' : 'Camera'}</div>
        ${statusLine}
        <div class="device-footer" style="margin-top:10px;">
          <span style="color:#4a6080;font-size:11px;">${d.location}</span>
          <span class="device-open">Open →</span>
        </div>
      </div>`;
  }

  function renderGrid(){
    const grid = document.getElementById('deviceGrid');
    if (!devices.length) {
      grid.innerHTML = `<div class="grid-message">No devices registered yet. Click "Add Device" to connect your first camera or smart lock.</div>`;
    } else {
      grid.innerHTML = devices.map(deviceCard).join('');
    }
    grid.querySelectorAll('.device-card[data-id]').forEach(card => {
      card.addEventListener('click', () => {
        window.location.href = `/devices/${card.dataset.id}/`;
      });
    });
  }

  loadDevices();

  const modal = document.getElementById('addDeviceModal');
  const openBtn = document.getElementById('openAddDevice');
  const closeBtn = document.getElementById('closeAddDevice');
  const cancelBtn = document.getElementById('cancelAddDevice');
  const submitBtn = document.getElementById('submitAddDevice');
  const errorBox = document.getElementById('formError');

  function openModal(){ modal.classList.add('open'); }
  function closeModal(){
    modal.classList.remove('open');
    errorBox.style.display = 'none';
    ['fName','fLocation','fIp','fStream'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('fType').value = 'camera';
  }

  openBtn.addEventListener('click', openModal);
  closeBtn.addEventListener('click', closeModal);
  cancelBtn.addEventListener('click', closeModal);
  modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });

  submitBtn.addEventListener('click', async () => {
    const name = document.getElementById('fName').value.trim();
    const type = document.getElementById('fType').value;
    const location = document.getElementById('fLocation').value.trim();
    const ip = document.getElementById('fIp').value.trim();
    const streamUrl = document.getElementById('fStream').value.trim();

    if (!name || !location || !ip) {
      errorBox.textContent = 'Device name, location and IP address are required.';
      errorBox.style.display = 'block';
      return;
    }

    const payload = { name, device_type: type, location, ip_address: ip, stream_url: streamUrl || null };

    submitBtn.disabled = true;
    submitBtn.textContent = 'Registering…';
    errorBox.style.display = 'none';

    try {
      const res = await fetch(`${API_BASE}/homes/${HOME_ID}/devices/register/`, {
        method: 'POST',
        headers: authHeaders({ 'Content-Type': 'application/json' }),
        body: JSON.stringify(payload),
      });

      if (handleAuthFailure(res)) return;
      if (!res.ok) {
        const data = await res.json().catch(() => ({}));
        throw new Error(data.detail || Object.values(data)[0] || 'Request failed');
      }
      const created = await res.json();

      devices.push({
        id: created.id,
        name: created.name,
        type: created.device_type,
        location: created.location,
        status: created.status || 'online',
        lastActive: 'Just now',
      });

      renderStats();
      renderGrid();
      closeModal();
    } catch (err) {
      errorBox.textContent = typeof err.message === 'string' ? err.message : 'Could not register device. Please try again.';
      errorBox.style.display = 'block';
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Register device';
    }
  });
</script>
</body>
</html>
