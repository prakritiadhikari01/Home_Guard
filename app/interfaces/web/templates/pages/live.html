{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>HomeGuard – Live Surveillance</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  <style>
    :root{
      --c-normal:#3b82f6; --c-normal-bg:rgba(59,130,246,.12); --c-normal-bd:rgba(59,130,246,.3);
      --c-away:#a855f7;   --c-away-bg:rgba(168,85,247,.12);   --c-away-bd:rgba(168,85,247,.3);
      --c-high:#f59e0b;   --c-high-bg:rgba(245,158,11,.12);   --c-high-bd:rgba(245,158,11,.3);
      --c-sos:#ef4444;    --c-sos-bg:rgba(239,68,68,.14);     --c-sos-bd:rgba(239,68,68,.32);
      --c-safe:#22c55e;   --c-safe-bg:rgba(34,197,94,.12);    --c-safe-bd:rgba(34,197,94,.3);
    }

    /* ---- Section / category headers ---- */
    .section-title{ display:flex; align-items:center; gap:9px; }
    .section-title .rule{ width:3px; height:16px; border-radius:2px; background:var(--c-normal); }
    .cat-count{ color:#4a6080; font-size:11.5px; font-weight:600; }

    /* ---- Filter tabs ---- */
    .live-tabs{ display:flex; gap:8px; margin-bottom:18px; }
    .live-tab{
      padding:7px 16px; border-radius:9px; font-size:13px; font-weight:600; cursor:pointer;
      border:1px solid rgba(255,255,255,.08); background:rgba(255,255,255,.03); color:#8ca2c2;
      transition:.15s;
    }
    .live-tab.active{ background:var(--c-normal-bg); border-color:var(--c-normal-bd); color:var(--c-normal); }
    .live-tab:hover:not(.active){ background:rgba(255,255,255,.06); }

    /* ---- Camera grid / tile ---- */
    .cam-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(270px, 1fr)); gap:16px; margin-bottom:28px; }
    .live-cam-card{ cursor:pointer; border-radius:12px; overflow:hidden; transition:.2s; position:relative; }
    .live-cam-card:hover{ transform:translateY(-2px); box-shadow:0 10px 26px rgba(0,0,0,.4); }
    .cam-expand-btn{
      position:absolute; top:10px; right:10px; z-index:3;
      width:26px; height:26px; border-radius:7px; border:none; cursor:pointer;
      background:rgba(0,0,0,.45); color:#cdd9ef; display:flex; align-items:center; justify-content:center;
    }
    .cam-expand-btn:hover{ background:var(--c-normal); color:white; }
    .cam-offline-fill{ position:absolute; inset:0; background:#071520; display:flex; align-items:center; justify-content:center; color:#3d5170; font-size:12px; }

    /* ---- Inline lock control overlaid on a paired camera tile ---- */
    .tile-lock-pill{
      position:absolute; bottom:44px; right:10px; z-index:3;
      display:flex; align-items:center; gap:6px;
      padding:6px 10px 6px 8px; border-radius:20px; cursor:pointer;
      background:rgba(10,16,28,.78); backdrop-filter:blur(4px);
      border:1px solid rgba(255,255,255,.1);
      font-size:11.5px; font-weight:700; color:#cdd9ef; transition:.2s;
    }
    .tile-lock-pill:hover{ border-color:rgba(255,255,255,.25); }
    .tile-lock-pill .dot{ width:7px; height:7px; border-radius:50%; flex-shrink:0; }
    .tile-lock-pill[data-status="LOCKED"] .dot{ background:var(--c-safe); box-shadow:0 0 6px var(--c-safe); }
    .tile-lock-pill[data-status="UNLOCKED"] .dot{ background:var(--c-high); box-shadow:0 0 6px var(--c-high); }
    .tile-lock-pill[data-status="VERIFYING"] .dot{ background:var(--c-normal); animation:dotPulse 1s ease-out infinite; }
    .tile-lock-pill[data-status="VERIFYING"]{ pointer-events:none; }
    @keyframes dotPulse{ 0%{opacity:1;} 50%{opacity:.35;} 100%{opacity:1;} }

    /* ---- Fallback strip for locks with no matched camera ---- */
    .lock-strip-item{
      display:flex; align-items:center; gap:12px; padding:14px 16px;
    }
    .lock-strip-orb{
      width:38px; height:38px; border-radius:50%; flex-shrink:0;
      display:flex; align-items:center; justify-content:center; cursor:pointer;
      background:var(--c-safe-bg); color:var(--c-safe); transition:.2s;
    }
    .lock-strip-orb[data-status="UNLOCKED"]{ background:var(--c-high-bg); color:var(--c-high); }
    .lock-strip-orb[data-status="VERIFYING"]{ background:var(--c-normal-bg); color:var(--c-normal); pointer-events:none; }

    /* ---- Enlarge modal ---- */
    .cam-modal-backdrop{
      display:none; position:fixed; inset:0; z-index:50; background:rgba(4,8,16,.82);
      align-items:center; justify-content:center; padding:24px;
    }
    .cam-modal-backdrop.open{ display:flex; }
    .cam-modal{
      width:100%; max-width:860px; border-radius:16px; overflow:hidden;
      background:#0c1524; border:1px solid rgba(255,255,255,.08);
    }
    .cam-modal-feed{ position:relative; background:#071520; aspect-ratio:16/9; }
    .cam-modal-feed img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
    .cam-modal-close{
      position:absolute; top:12px; right:12px; z-index:2;
      width:30px; height:30px; border-radius:8px; border:none; cursor:pointer;
      background:rgba(0,0,0,.5); color:white; display:flex; align-items:center; justify-content:center;
    }
    .cam-modal-body{ padding:20px 22px; }
    .cam-modal-lockrow{
      margin-top:16px; padding-top:16px; border-top:1px solid rgba(255,255,255,.06);
      display:flex; align-items:center; justify-content:space-between; gap:14px;
    }
    .modal-unlock-btn{
      display:flex; align-items:center; gap:8px; padding:9px 18px; border-radius:9px;
      border:none; cursor:pointer; font-size:13px; font-weight:700; transition:.2s;
    }
    .modal-unlock-btn:disabled{ opacity:.55; cursor:not-allowed; }

    .empty-state{ text-align:center; color:#4a6080; font-size:13px; padding:40px 20px; }
  </style>
</head>
<body>
<div class="app-layout">
  <div class="sidebar" id="sidebar"></div>
  <div class="main-content">
    <div id="topbar"></div>
    <div class="page-body">

      <div class="live-tabs">
        <div class="live-tab active" data-filter="all" onclick="setFilter('all', this)">All Devices</div>
        <div class="live-tab" data-filter="camera" onclick="setFilter('camera', this)">Cameras</div>
        <div class="live-tab" data-filter="smart_lock" onclick="setFilter('smart_lock', this)">Smart Locks</div>
      </div>

      <div id="cameraSectionWrap">
        <div class="section-title mb-3">
          <span class="rule"></span>
          <div>
            <div style="color:white;font-size:15px;font-weight:700;">Cameras</div>
            <div style="color:#4a6080;font-size:11px;margin-top:1px;" id="camSubtitle">Loading…</div>
          </div>
          <span class="cat-count" id="camCount"></span>
        </div>
        <div id="camGrid" class="cam-grid"></div>
      </div>

      <div id="lockSectionWrap" style="display:none;">
        <div class="section-title mb-3">
          <span class="rule" style="background:var(--c-away);"></span>
          <div>
            <div style="color:white;font-size:15px;font-weight:700;">Other Locks</div>
            <div style="color:#4a6080;font-size:11px;margin-top:1px;">Not paired with a camera feed</div>
          </div>
        </div>
        <div id="lockStrip" class="card" style="padding:4px 16px;"></div>
      </div>

    </div>
  </div>
</div>

<!-- Enlarge modal -->
<div class="cam-modal-backdrop" id="camModalBackdrop" onclick="if(event.target===this) closeCamModal()">
  <div class="cam-modal">
    <div class="cam-modal-feed">
      <button class="cam-modal-close" onclick="closeCamModal()">✕</button>
      <img id="modalFeedImg" style="display:none;" alt="">
      <div id="modalFeedFallback" class="cam-offline-fill">No live feed</div>
      <div style="position:absolute;top:12px;left:12px;z-index:2;" id="modalLiveBadge"></div>
    </div>
    <div class="cam-modal-body">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;">
        <div>
          <div id="modalCamName" style="color:white;font-size:17px;font-weight:700;"></div>
          <div id="modalCamLocation" style="color:#6a8aaa;font-size:12.5px;margin-top:3px;"></div>
        </div>
        <span class="badge" id="modalDetectionBadge"></span>
      </div>
      <div class="cam-modal-lockrow" id="modalLockRow" style="display:none;">
        <div>
          <div style="color:#cdd9ef;font-size:13px;font-weight:700;" id="modalLockLabel">Locked</div>
          <div style="color:#6a8aaa;font-size:11.5px;margin-top:2px;" id="modalLockDesc"></div>
        </div>
        <button class="modal-unlock-btn" id="modalLockBtn" onclick="toggleLock(currentModalLockId, true)"></button>
      </div>
    </div>
  </div>
</div>

<script src="{% static 'js/sidebar.js' %}"></script>
<script>

const dotColorMap = { critical:'#ef4444', warning:'#eab308', success:'#22c55e' };
let allDevices = [];          // raw device list
let cameras = [];             // enriched camera entries {..., pairedLockId}
let lockStates = new Map();   // lockId -> { id, deviceName, location, status, verificationId, pollTimer, pollTimeout, last_access_result, last_unlocked_by_name }
let currentFilter = 'all';
let currentModalCamId = null;
let currentModalLockId = null;

function detectionBadgeClass(text){
    const t = (text || '').toLowerCase();
    if (t.includes('unknown') || t.includes('intruder')) return 'badge-warning';
    if (t.includes('vehicle')) return 'badge-vehicle';
    return 'badge-known';
}

function normLoc(s){ return (s || '').trim().toLowerCase(); }

/* ===================== LOAD ===================== */

async function loadLivePage(){
    const token = localStorage.getItem("access");
    const homeId = localStorage.getItem("active_home");
    const headers = { Authorization: `Bearer ${token}` };

    try {
        const [devicesRes, dashRes] = await Promise.all([
            fetch(`/api/homes/${homeId}/devices/`, { headers }),
            fetch(`/api/dashboard/${homeId}/`, { headers }),
        ]);

        if (!devicesRes.ok) throw new Error('devices fetch failed');
        allDevices = await devicesRes.json();

        let livePreview = [];
        if (dashRes.ok) {
            const dash = await dashRes.json();
            livePreview = dash.live_preview || [];
        }

        const camDevices = allDevices.filter(d => d.device_type === 'camera');
        const lockDevices = allDevices.filter(d => d.device_type === 'smart_lock');

        // Enrich cameras with stream_url / current_detection from the dashboard preview, matched by id
        cameras = camDevices.map(cam => {
            const preview = livePreview.find(p => p.id === cam.id) || {};
            return {
                ...cam,
                stream_url: preview.stream_url || null,
                current_detection: preview.current_detection || null,
            };
        });

        // Init lock state map
        lockDevices.forEach(l => {
            lockStates.set(l.id, {
                id: l.id, deviceName: l.name, location: l.location,
                status: null, verificationId: null,
                pollTimer: null, pollTimeout: null,
                last_access_result: null, last_unlocked_by_name: null,
            });
        });

        // Pair each lock to a camera by matching location (exact, then substring)
        cameras.forEach(cam => { cam.pairedLockId = null; });
        lockDevices.forEach(lock => {
            const loc = normLoc(lock.location);
            let match = cameras.find(c => normLoc(c.location) === loc && !c.pairedLockId);
            if (!match && loc) {
                match = cameras.find(c => !c.pairedLockId && (normLoc(c.location).includes(loc) || loc.includes(normLoc(c.location))));
            }
            if (match) match.pairedLockId = lock.id;
        });

        // Fetch live status for every lock (paired or not)
        await Promise.all(lockDevices.map(l => refreshLock(l.id)));

        renderAll();
    } catch (err) {
        console.error("Failed to load live page:", err);
        document.getElementById('camGrid').innerHTML =
            `<div class="empty-state" style="grid-column:1/-1;">Couldn't load devices right now. Please refresh.</div>`;
    }
}

/* ===================== RENDER ===================== */

function setFilter(filter, tabEl){
    currentFilter = filter;
    document.querySelectorAll('.live-tab').forEach(t => t.classList.remove('active'));
    tabEl.classList.add('active');
    renderAll();
}

function renderAll(){
    document.getElementById('cameraSectionWrap').style.display = (currentFilter === 'smart_lock') ? 'none' : 'block';
    renderCameraGrid();
    renderUnpairedLockStrip();
}

function renderCameraGrid(){
    const grid = document.getElementById('camGrid');
    const subtitle = document.getElementById('camSubtitle');
    const countEl = document.getElementById('camCount');

    if (!cameras.length){
        subtitle.textContent = 'No cameras registered';
        countEl.textContent = '';
        grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;">No cameras have been added to this home yet.</div>`;
        return;
    }

    const onlineCount = cameras.filter(c => c.status === 'online').length;
    subtitle.textContent = onlineCount
        ? `${onlineCount} camera${onlineCount > 1 ? 's' : ''} streaming · AI overlays active`
        : 'No cameras streaming';
    countEl.textContent = `${cameras.length} total`;

    grid.innerHTML = cameras.map((cam, idx) => {
        const isOnline = cam.status === 'online';
        const hasDetection = cam.current_detection && cam.current_detection !== 'No Activity';
        const badge = hasDetection
            ? `<span class="badge ${detectionBadgeClass(cam.current_detection)}">${cam.current_detection}</span>`
            : '';
        const camCode = `CAM-${String(idx + 1).padStart(2, '0')}`;
        const lock = cam.pairedLockId ? lockStates.get(cam.pairedLockId) : null;

        return `
        <div class="live-cam-card card" onclick="openCamModal('${cam.id}')">
          <div class="cam-feed" style="min-height:180px;">
            <div class="cam-feed-overlay"></div>
            ${isOnline && cam.stream_url
                ? `<img src="${cam.stream_url}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;" alt="${cam.name}">`
                : `<div class="cam-offline-fill">${isOnline ? 'No live feed' : 'Camera offline'}</div>`
            }
            <div style="position:absolute;top:10px;left:10px;display:flex;gap:4px;z-index:2;">
                <span class="badge ${isOnline ? 'badge-live' : ''}" style="${isOnline ? '' : 'background:rgba(255,255,255,.08);color:#6a7a9a;'}">${isOnline ? '● LIVE' : '○ OFFLINE'}</span>
                <span class="badge badge-cam">${camCode}</span>
            </div>
            <button class="cam-expand-btn" onclick="event.stopPropagation(); openCamModal('${cam.id}')">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
            </button>
            ${lock ? renderLockPillHtml(lock) : ''}
            <div class="cam-label">
                <div>
                    <div style="color:white;font-size:12.5px;font-weight:600;">${cam.name}</div>
                    <div style="color:#6a8aaa;font-size:10px;">${cam.location || ''}</div>
                </div>
                ${badge}
            </div>
          </div>
        </div>`;
    }).join('');
}

function renderLockPillHtml(lock){
    const status = lock.status || 'LOCKED';
    const label = status === 'VERIFYING' ? 'Verifying…' : (status === 'LOCKED' ? 'Locked' : 'Unlocked');
    return `
      <div class="tile-lock-pill" data-status="${status}" data-lock-id="${lock.id}"
           onclick="event.stopPropagation(); toggleLock('${lock.id}', false)">
        <span class="dot"></span><span>${label}</span>
      </div>`;
}

function renderUnpairedLockStrip(){
    const wrap = document.getElementById('lockSectionWrap');
    const unpaired = [...lockStates.values()].filter(l =>
        !cameras.some(c => c.pairedLockId === l.id)
    );

    if (currentFilter === 'camera' || !unpaired.length) {
        wrap.style.display = 'none';
        return;
    }
    wrap.style.display = 'block';

    document.getElementById('lockStrip').innerHTML = unpaired.map(lock => {
        const status = lock.status || 'LOCKED';
        const label = status === 'VERIFYING' ? 'Verifying…' : (status === 'LOCKED' ? 'Locked' : 'Unlocked');
        const sub = status === 'VERIFYING' ? 'Look at the camera' : (status === 'LOCKED' ? 'Secure' : 'Tap to secure');
        return `
        <div class="lock-strip-item">
          <div class="lock-strip-orb" data-status="${status}" onclick="toggleLock('${lock.id}', false)">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          </div>
          <div style="flex:1;">
            <div style="color:white;font-size:13.5px;font-weight:700;">${lock.deviceName}</div>
            <div style="color:#6a8aaa;font-size:11.5px;">${lock.location || ''} · ${sub}</div>
          </div>
        </div>`;
    }).join('');
}

/* ===================== LOCK LOGIC (per-lock, keyed by id) ===================== */

async function refreshLock(lockId){
    const token = localStorage.getItem("access");
    const homeId = localStorage.getItem("active_home");
    const lock = lockStates.get(lockId);
    if (!lock) return null;

    try {
        const res = await fetch(`/api/homes/${homeId}/locks/${lockId}/`, { headers: { Authorization: `Bearer ${token}` } });
        if (!res.ok) throw new Error('lock fetch failed');
        const data = await res.json();
        lock.status = data.status;
        lock.verificationId = data.current_verification_id;
        lock.last_access_result = data.last_access_result;
        lock.last_unlocked_by_name = data.last_unlocked_by_name;
        return lock;
    } catch (err) {
        return null;
    }
}

function stopLockPolling(lockId){
    const lock = lockStates.get(lockId);
    if (!lock) return;
    if (lock.pollTimer) { clearInterval(lock.pollTimer); lock.pollTimer = null; }
    if (lock.pollTimeout) { clearTimeout(lock.pollTimeout); lock.pollTimeout = null; }
}

function startLockPolling(lockId, verificationId){
    stopLockPolling(lockId);
    const lock = lockStates.get(lockId);

    lock.pollTimer = setInterval(async () => {
        const updated = await refreshLock(lockId);
        if (!updated) return;

        rerenderLockUI(lockId);

        if (updated.verificationId !== verificationId) { stopLockPolling(lockId); return; }
        if (updated.status === 'VERIFYING') return;
        if (updated.status === 'UNLOCKED') return; // keep watching for the 15s auto-relock

        stopLockPolling(lockId);
    }, 1000);

    lock.pollTimeout = setTimeout(async () => {
        stopLockPolling(lockId);
        await refreshLock(lockId);
        rerenderLockUI(lockId);
    }, 25000);
}

async function toggleLock(lockId, fromModal){
    const lock = lockStates.get(lockId);
    if (!lock || lock.status === null || lock.status === 'VERIFYING') return;

    const token = localStorage.getItem("access");
    const homeId = localStorage.getItem("active_home");
    const action = lock.status === 'LOCKED' ? 'unlock' : 'lock';

    try {
        const res = await fetch(`/api/homes/${homeId}/locks/${lockId}/${action}/`, {
            method: 'POST',
            headers: { Authorization: `Bearer ${token}` },
        });
        if (!res.ok) throw new Error(`${action} failed`);

        if (action === 'unlock') {
            const data = await res.json(); // { status, verification_id, message }
            lock.status = 'VERIFYING';
            lock.verificationId = data.verification_id;
            rerenderLockUI(lockId);
            startLockPolling(lockId, data.verification_id);
        } else {
            stopLockPolling(lockId);
            await refreshLock(lockId);
            rerenderLockUI(lockId);
        }
    } catch (err) {
        alert(`Could not ${action} the door. Please try again.`);
    }
}

function rerenderLockUI(lockId){
    const lock = lockStates.get(lockId);
    if (!lock) return;

    // Pill on the camera tile
    const pill = document.querySelector(`.tile-lock-pill[data-lock-id="${lockId}"]`);
    if (pill) {
        const status = lock.status || 'LOCKED';
        pill.dataset.status = status;
        pill.querySelector('span:last-child').textContent =
            status === 'VERIFYING' ? 'Verifying…' : (status === 'LOCKED' ? 'Locked' : 'Unlocked');
    } else {
        renderCameraGrid(); // pairing/lock wasn't on the DOM yet (unlikely) — full re-render
    }

    // Unpaired strip
    renderUnpairedLockStrip();

    // Modal, if this lock's card is currently open
    if (currentModalLockId === lockId) updateModalLockUI();
}

/* ===================== ENLARGE MODAL ===================== */

function openCamModal(camId){
    const cam = cameras.find(c => c.id === camId);
    if (!cam) return;
    currentModalCamId = camId;
    currentModalLockId = cam.pairedLockId || null;

    const img = document.getElementById('modalFeedImg');
    const fallback = document.getElementById('modalFeedFallback');
    const isOnline = cam.status === 'online';

    if (isOnline && cam.stream_url) {
        img.src = cam.stream_url; img.style.display = 'block'; fallback.style.display = 'none';
    } else {
        img.style.display = 'none'; fallback.style.display = 'flex';
        fallback.textContent = isOnline ? 'No live feed' : 'Camera offline';
    }

    document.getElementById('modalLiveBadge').innerHTML =
        `<span class="badge ${isOnline ? 'badge-live' : ''}" style="${isOnline ? '' : 'background:rgba(255,255,255,.08);color:#6a7a9a;'}">${isOnline ? '● LIVE' : '○ OFFLINE'}</span>`;

    document.getElementById('modalCamName').textContent = cam.name;
    document.getElementById('modalCamLocation').textContent = cam.location || '';

    const hasDetection = cam.current_detection && cam.current_detection !== 'No Activity';
    const detBadge = document.getElementById('modalDetectionBadge');
    if (hasDetection) {
        detBadge.textContent = cam.current_detection;
        detBadge.className = `badge ${detectionBadgeClass(cam.current_detection)}`;
        detBadge.style.display = 'inline-block';
    } else {
        detBadge.style.display = 'none';
    }

    document.getElementById('modalLockRow').style.display = currentModalLockId ? 'flex' : 'none';
    if (currentModalLockId) updateModalLockUI();

    document.getElementById('camModalBackdrop').classList.add('open');
}

function updateModalLockUI(){
    const lock = lockStates.get(currentModalLockId);
    if (!lock) return;
    const status = lock.status || 'LOCKED';

    document.getElementById('modalLockLabel').textContent =
        status === 'VERIFYING' ? 'Verifying…' : (status === 'LOCKED' ? 'Locked' : 'Unlocked');

    document.getElementById('modalLockDesc').textContent =
        status === 'VERIFYING' ? 'Look at this camera to verify your identity.'
        : status === 'LOCKED' ? (lock.last_access_result === 'DENIED' ? 'Last scan wasn\'t recognized.' : 'Face verification required to unlock.')
        : `Unlocked${lock.last_unlocked_by_name ? ' by ' + lock.last_unlocked_by_name : ''}. Relocks automatically.`;

    const btn = document.getElementById('modalLockBtn');
    btn.disabled = status === 'VERIFYING';
    btn.style.background = status === 'LOCKED' ? 'var(--c-normal)' : 'rgba(255,255,255,0.1)';
    btn.style.color = status === 'LOCKED' ? 'white' : '#cdd9ef';
    btn.textContent = status === 'VERIFYING' ? 'Verifying…' : (status === 'LOCKED' ? 'Unlock with face scan' : 'Lock door');
}

function closeCamModal(){
    document.getElementById('camModalBackdrop').classList.remove('open');
    currentModalCamId = null;
    currentModalLockId = null;
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeCamModal(); });

document.getElementById("topbar").innerHTML = renderTopbar(
    "Live Surveillance",

);
loadTopbarUser();
initHomeSwitcher();
loadHomeNotifications();
loadLivePage();

</script>
